<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Оркестратор · Запуски</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><strong><span class="mark">≋</span> Оркестратор</strong><span id="connection" role="status">Подключение…</span></header>
<main><section class="title"><h1>Запуски процессов</h1><button id="demo">▷ &nbsp; Демо конфликта</button></section>
<form><label>Процесс<select id="process" required></select></label><label>Расчётная дата<input type="date" id="day" value="2026-11-20" required></label><button class="primary">Запустить</button><small id="resources"></small></form><p id="message" role="status"></p>
<div class="grid"><section><div class="section"><h2>Очередь запусков</h2><span id="count"></span></div><div class="scroll"><table><thead><tr><th>Запуск</th><th>Процесс</th><th>Дата</th><th>Состояние</th><th>Результат</th></tr></thead><tbody></tbody></table></div><p id="empty">Запусков пока нет. Выберите процесс или запустите демо.</p></section><aside><h2>Детали запуска</h2><div id="detail">Выберите запуск в очереди.</div></aside></div></main></body></html>
